        <h1>播客知识地图</h1>
        <p class="lede">把最近一周的播客人物、公司、技术和话题串起来，看哪些节点正在反复出现，它们又出现在哪些播客里。</p>

      </div>

      <div class="legend-grid">

        <div><strong>大小</strong><p>圆越大，表示该节点在最近一周出现次数越多。</p></div>
        <div><strong>关联</strong><p>点击任何节点，右侧会列出它出现过的播客和关键内容。连线表示两个节点常在同一期里一起出现。</p></div>
      </div>
    </section>
    <section class="layout">
      <div class="panel graph-panel">
        <div class="graph-head"><h2>本周节点图</h2><p>轻微浮动的节点表示可探索的历史索引。</p></div>

      "claims": [
        "当前全球AI基础设施建设规模空前，其资本、时间和人才投入前所未有，数据中心电力消耗将超过去50年总和。",
        "AI能力已从简单指令执行跃升至意图理解和复杂推理，许多专家认为我们已达到甚至超越了20年前定义的AGI。",
        "Cerebras等公司通过新型芯片架构打破了传统摩尔定律在AI推理领域的限制，未来18个月性能将提升2倍以上。",
        "开源AI模型对于企业内部“普通问题”和数据主权需求日益重要，与前沿模型形成互补。",
        "AI的快速发展带来了安全和监管挑战，政府要求对强大模型进行“红队测试”以防范潜在风险。",
        "AI的递归学习机制使其能力呈指数级增长，预示着超智能的到来，未来AI将深入人类行为和社会组织领域。",
        "AI基础设施的史诗级扩张与芯片需求狂潮: Cerebras公司CEO Andrew Feldman指出，当前全球AI基础设施的建设规模堪比长城或金字塔，其资本、时间和人才投入前所未有。数据中心正以惊人的速度在全球各地拔地而起，未来几年其电力消耗将超过地球过去50年的总和，单个数据中心的用电量甚至超过中等城市。OpenAI、Anthropic、Google、Microsoft、AWS等巨头对AI算力的需求“永不满足”，它们甚至在芯片...",
        "AI能力跃迁: 从指令到意图理解与推理：AI的能力正经历从简单指令执行到深刻意图理解和复杂推理的巨大飞跃。过去，AI像“愚蠢的电脑”，严格执行指令，提示词的微小改动就能导致结果大相径庭。但现在，如OpenAI的Fable和56等模型，已能理解用户意图，甚至主动提出更好的解决方案，无需用户成为“提示词专家”。Feldman举例称，他使用的Bit Tenser项目中的GLM 52模型，能自主进行推理，甚至在后台“自我辩论”如何寻找全球..."
