        <h1>播客知识地图</h1>
        <p class="lede">把最近一周的播客人物、公司、技术和话题串起来，看哪些节点正在反复出现，它们又出现在哪些播客里。</p>

      </div>
    </section>

      <div class="legend-grid">
        <div><strong>颜色</strong><span><i class="dot type-person"></i>人物</span><span><i class="dot type-company"></i>公司</span><span><i class="dot type-technology"></i>技术</span><span><i class="dot type-theme"></i>话题</span></div>
        <div><strong>大小</strong><p>圆越大，表示该节点在最近一周出现次数越多。</p></div>
        <div><strong>关联</strong><p>点击任何节点，右侧会列出它出现过的播客和关键内容。连线表示两个节点常在同一期里一起出现。</p></div>
      </div>
    </section>
    <section class="layout">
      <div class="panel graph-panel">
        <div class="graph-head"><h2>本周节点图</h2><p>轻微浮动的节点表示可探索的历史索引。</p></div>

      </div>
      <aside id="detail" class="panel side"></aside>

function renderEvidence(v){const label=typeof v==='string'?v:(v.label||v.title||'');const href=typeof v==='string'?'':(v.href||v.url||'');return `<li>${href?`<a href="${esc(href)}">${esc(label)}</a>`:esc(label)}</li>`}
function renderInsights(){document.getElementById('insights').innerHTML=(data.insights||[]).slice(0,8).map(i=>`<article class="panel insight"><strong>${esc(i.entity)}</strong><p>${esc(i.summary)}</p></article>`).join('')}
function layoutGraph(){const w=svg.clientWidth||760,h=svg.clientHeight||620,cx=w/2,cy=h/2;const items=nodes.map((n,i)=>({...n,r:radius(n),x:cx+(Math.random()-.5)*w*.45,y:cy+(Math.random()-.5)*h*.45,index:i,phase:i*.73,amp:2.2+(i%5)*.45}));const typeBias={person:-.28,company:-.1,technology:.1,theme:.28};for(let step=0;step<280;step++){for(const n of items){const angle=(typeBias[n.type]??0)*Math.PI;const ring=0.18+Math.min(0.32,n.index/90);const tx=cx+Math.cos(angle+n.index*.28)*w*ring;const ty=cy+Math.sin(angle+n.index*.28)*h*ring*.72;n.x+=(tx-n.x)*.018;n.y+=(ty-n.y)*.018}for(let i=0;i<items.length;i++){for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1,min=a.r+b.r+24;if(dist<min){const push=(min-dist)/dist*.52,px=dx*push,py=dy*push;a.x-=px;b.x+=px;a.y-=py;b.y+=py}}}for(const n of items){n.x=Math.max(n.r+8,Math.min(w-n.r-95,n.x));n.y=Math.max(n.r+16,Math.min(h-n.r-22,n.y))}}const lookup=new Map(items.map(n=>[n.id,n]));svg.innerHTML='';const edgeEls=[];for(const e of edges){const s=lookup.get(e.source),t=lookup.get(e.target);if(!s||!t)continue;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','edge');line.dataset.source=e.source;line.dataset.target=e.target;svg.appendChild(line);edgeEls.push({el:line,e,source:s,target:t})}const nodeEls=[];for(const n of items){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','node');g.dataset.id=n.id;g.addEventListener('click',()=>selectNode(n.id));const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',n.r);c.setAttribute('class',cls(n.type));g.appendChild(c);const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.textContent=n.label;g.appendChild(label);svg.appendChild(g);nodeEls.push({el:g,c,label,n})}graphState={items,lookup,edgeEls,nodeEls,start:performance.now()};animateGraph(performance.now());highlightSelection()}
function animatedPos(n,t){return{x:n.x+Math.sin(t/1450+n.phase)*n.amp,y:n.y+Math.cos(t/1700+n.phase*.9)*n.amp}}
function animateGraph(now){if(!graphState)return;const t=now-graphState.start;for(const item of graphState.nodeEls){const p=animatedPos(item.n,t);item.c.setAttribute('cx',p.x);item.c.setAttribute('cy',p.y);item.label.setAttribute('x',p.x+item.n.r+5);item.label.setAttribute('y',p.y+3)}for(const item of graphState.edgeEls){const a=animatedPos(item.source,t),b=animatedPos(item.target,t);item.el.setAttribute('x1',a.x);item.el.setAttribute('y1',a.y);item.el.setAttribute('x2',b.x);item.el.setAttribute('y2',b.y);item.el.setAttribute('stroke-width',Math.max(1,Math.min(6,item.e.weight||1)))}requestAnimationFrame(animateGraph)}
function highlightSelection(){if(!graphState||!selectedId)return;const related=new Set(edges.filter(e=>e.source===selectedId||e.target===selectedId).flatMap(e=>[e.source,e.target]));for(const item of graphState.nodeEls){item.el.classList.toggle('is-active',item.n.id===selectedId);item.el.classList.toggle('is-dim',!related.has(item.n.id)&&item.n.id!==selectedId)}for(const item of graphState.edgeEls){const active=item.e.source===selectedId||item.e.target===selectedId;item.el.classList.toggle('is-active',active)}}
function selectNode(id){selectedId=id;const n=byId.get(id)||{id,label:id,type:'theme',weight:0},events=timelines[id]||[],related=(data.edges||[]).filter(e=>e.source===id||e.target===id).sort((a,b)=>(b.weight||0)-(a.weight||0)).slice(0,10).map(e=>e.source===id?e.target:e.source);detail.innerHTML=`<p class="eyebrow">${esc(typeLabel(n.type))}</p><h2>${esc(n.label||n.id)}</h2><div class="meta">\u672c\u5468\u51fa\u73b0 ${n.weight||0} \u6b21\uff1b\u4e0b\u65b9\u5217\u51fa ${events.length} \u671f\u76f8\u5173\u64ad\u5ba2\u5185\u5bb9</div><div class="chips">${related.map(x=>`<button type="button" data-id="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="timeline">${events.length?events.map(renderEvent).join(''):'<p class="meta">\u6682\u65e0\u5386\u53f2\u65f6\u95f4\u7ebf\u3002</p>'}</div>`;detail.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',()=>selectNode(b.dataset.id)));highlightSelection()}
function typeLabel(t){return{person:'\u4eba\u7269',company:'\u516c\u53f8',technology:'\u6280\u672f',theme:'\u8bdd\u9898'}[t]||'\u8282\u70b9'}
function renderEvent(e){const href=e.href||e.url||'';const title=href?`<a href="${esc(href)}">${esc(e.title)}</a>`:esc(e.title);const openLabel=String.fromCharCode(25171,24320,31616,25253,20301,32622);return`<article class="event"><div class="event-date">${esc(e.date)}</div><div class="event-title">${title}</div><div class="event-source">${esc(e.source)}</div><p class="claim">${esc(e.takeaway)}</p>${(e.claims||[]).slice(0,3).map(c=>`<p class="claim">- ${esc(c)}</p>`).join('')}${href?`<a class="episode-link" href="${esc(href)}">${openLabel}</a>`:''}</article>`}
function search(v){const q=v.trim().toLowerCase();const m=q?searchIndex.filter(i=>i.label.toLowerCase().includes(q)).slice(0,8):allNodes.slice(0,8);suggestions.innerHTML=m.map(i=>`<button type="button" data-id="${esc(i.id)}">${esc(i.label)}</button>`).join('');suggestions.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectNode(b.dataset.id)));if(q&&m[0])selectNode(m[0].id)}
document.getElementById('search').addEventListener('input',e=>search(e.target.value));renderInsights();layoutGraph();search('');selectNode((nodes[0]||searchIndex[0]||{id:'Podcast'}).id);renderNarratives();window.addEventListener('resize',layoutGraph);
</script>
</body>
