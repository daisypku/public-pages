<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日信号</title>
  <style>
:root { color-scheme: light; --ink:#17202a; --muted:#687385; --line:#dfe5ec; --paper:#fff; --canvas:#f3f6f8; --accent:#0b57d0; --green:#0f766e; }
* { box-sizing: border-box; }
body { margin:0; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height:1.65; color:var(--ink); background:linear-gradient(180deg,#eef4f7 0,rgba(238,244,247,0) 360px),var(--canvas); }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
main { max-width:980px; margin:0 auto; padding:40px 22px 80px; min-height:100vh; }
.article-shell { max-width:820px; margin:0 auto; padding:44px 48px 64px; background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 18px 50px rgba(23,32,42,.08); }
.hero { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:38px; align-items:center; padding:42px 0 38px; border-bottom:1px solid var(--line); }
.kicker { margin:0 0 12px; color:var(--green); font-size:.82rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.hero h1 { margin:0; max-width:760px; font-size:4.4rem; line-height:.98; letter-spacing:0; }
.lede { max-width:650px; margin:22px 0 0; color:var(--muted); font-size:1.1rem; }
.hero-link { margin-top:18px; font-weight:800; }
.hero-art { margin:0; aspect-ratio:4/3; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--paper); box-shadow:0 18px 40px rgba(23,32,42,.1); }
.hero-art img, .article-postcard img { width:100%; height:100%; display:block; object-fit:cover; }
.article-postcard { margin:0 0 34px; aspect-ratio:4/3; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:#eef4f7; }
.section-heading { margin:34px 0 14px; display:flex; justify-content:space-between; align-items:end; }
.section-heading h2 { margin:0; font-size:1.4rem; }
.cards { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
.digest-card { margin:0; }
.digest-card a { min-height:92px; display:grid; grid-template-columns:150px 1fr auto; gap:20px; align-items:center; padding:20px 22px; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 28px rgba(23,32,42,.05); }
.digest-card a:hover { text-decoration:none; border-color:#b9c7d8; transform:translateY(-1px); }
.card-date { color:var(--green); font-weight:700; font-variant-numeric:tabular-nums; }
.card-title { font-size:1.08rem; font-weight:700; }
.card-action { color:var(--accent); font-size:.92rem; font-weight:700; white-space:nowrap; }
.article-page main { max-width:900px; }
.article-page h1 { margin:0 0 8px; font-size:2.7rem; line-height:1.08; letter-spacing:0; }
.page-date { margin:0 0 30px; color:var(--muted); font-size:.95rem; }
.article-page h2 { font-size:1.25rem; margin:42px 0 12px; padding-top:18px; border-top:1px solid var(--line); }
.run-block + .run-block { margin-top:42px; padding-top:8px; border-top:2px solid var(--line); }
p { margin:10px 0; } .article-page p { color:#243241; } ul { padding-left:24px; } li { margin:8px 0; }
@media (max-width:720px) { main{padding:28px 16px 64px;} .article-shell{padding:30px 22px 44px;} .hero{grid-template-columns:1fr; gap:22px; padding-top:34px;} .hero h1{font-size:2.5rem;} .hero-art{max-width:420px;} .article-page h1{font-size:2rem;} .digest-card a{grid-template-columns:1fr; gap:8px; min-height:0;} .card-action{white-space:normal;} }

.signal-hero { padding:42px 0 28px; border-bottom:1px solid var(--line); }
.signal-hero h1 { margin:0; font-size:4rem; line-height:1; }
.signal-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:28px; align-items:start; }
.signal-panel { min-width:0; }
.signal-card { background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin:0 0 12px; box-shadow:0 10px 28px rgba(23,32,42,.05); }
.signal-card h3 { margin:4px 0 8px; font-size:1.05rem; line-height:1.35; }
.signal-card p { margin:8px 0; color:#243241; }
.signal-meta, .authors, .signal-generated { color:var(--muted); font-size:.9rem; }
.source-link { display:inline-block; margin-top:4px; font-weight:800; }
.badge { display:inline-block; margin-left:6px; padding:1px 7px; border:1px solid var(--line); border-radius:999px; color:var(--green); font-size:.78rem; }
.empty-note { color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:18px 20px; }
.signal-notes { margin-top:18px; }
@media (max-width:820px) { .signal-grid{grid-template-columns:1fr;} .signal-hero h1{font-size:2.5rem;} }

</style>
</head>

</body>
</html>
