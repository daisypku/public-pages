<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>播客简报 2026-05-24</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #687385;
      --line: #dfe5ec;
      --paper: #ffffff;
      --canvas: #f3f6f8;
      --accent: #0b57d0;
      --accent-soft: #e8f0fe;
      --green: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      color: var(--ink);
      background:
        linear-gradient(180deg, #eef4f7 0, rgba(238, 244, 247, 0) 360px),
        var(--canvas);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 22px 80px;
      min-height: 100vh;
    }
    .article-shell {
      max-width: 820px;
      margin: 0 auto;
      padding: 44px 48px 64px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(23, 32, 42, 0.08);
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 38px;
      align-items: center;
      padding: 42px 0 38px;
      border-bottom: 1px solid var(--line);
    }
    .kicker {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .hero h1 {
      margin: 0;
      max-width: 760px;
      font-size: 4.4rem;
      line-height: 0.98;
      letter-spacing: 0;
    }
    .lede {
      max-width: 650px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .hero-art {
      margin: 0;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 18px 40px rgba(23, 32, 42, 0.1);
    }
    .hero-art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .section-heading {
      margin: 34px 0 18px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: 1.4rem;
    }
    .cards {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    .digest-card {
      margin: 0;
    }
    .digest-card a {
      min-height: 92px;
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 20px 22px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(23, 32, 42, 0.05);
    }
    .digest-card a:hover {
      text-decoration: none;
      border-color: #b9c7d8;
      transform: translateY(-1px);
    }
    .card-date {
      color: var(--green);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
    }
    .card-action {
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .article-page main {
      max-width: 900px;
    }
    .article-page h1 {
      margin: 0 0 8px;
      font-size: 2.7rem;
      line-height: 1.08;
      letter-spacing: 0;
    }
    .page-date {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .article-page h2 {
      font-size: 1.25rem;
      margin: 42px 0 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    p { margin: 10px 0; }
    .article-page p { color: #243241; }
    ul { padding-left: 24px; }
    li { margin: 8px 0; }
    .article-page li { padding-left: 2px; }
    @media (max-width: 720px) {
      main { padding: 28px 16px 64px; }
      .article-shell { padding: 30px 22px 44px; }
      .hero {
        grid-template-columns: 1fr;
        gap: 22px;
        padding-top: 34px;
      }
      .hero h1 { font-size: 2.5rem; }
      .hero-art { max-width: 420px; }
      .article-page h1 { font-size: 2rem; }
      .digest-card a {
        grid-template-columns: 1fr;
        gap: 8px;
        min-height: 0;
      }
      .card-action { white-space: normal; }
    }
  </style>
</head>
<body class="article-page">
  <main>
<article class="article-shell">
<p class="page-date">5月24日 周日</p>
<h1>播客简报 2026-05-24</h1>
<p>今天没有新的完整摘要。</p>
    </article>
  </main>
</body>
</html>
