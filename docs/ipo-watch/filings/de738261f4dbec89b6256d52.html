  <style>
    :root {

      --bg: #f5f6f8;

      --muted: #637083;
      --soft: #f8fafc;
      --accent: #0f766e;

      --warning: #fff7ed;

    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); }

    h2 { margin: 0 0 14px; font-size: 18px; }
    h3 { margin: 0; font-size: 16px; line-height: 1.35; }
    p { margin: 8px 0; line-height: 1.65; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { margin: 8px 0 0; padding-left: 20px; }
    li { margin: 4px 0; line-height: 1.55; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 13px; }
    th { color: var(--muted); font-weight: 650; background: #fbfcfe; white-space: nowrap; }
    td:not(:first-child), th:not(:first-child) { text-align: right; white-space: nowrap; }
    .muted { color: var(--muted); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .count { color: var(--muted); font-size: 13px; }
    .date-section { margin-top: 18px; }
    .date-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; color: var(--ink); font-size: 15px; }
    .date-heading::after { content: ""; height: 1px; background: var(--line); flex: 1; }
    .filing-list { display: grid; gap: 12px; }
    .filing-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .filing-card.today { border-color: #99d8ce; box-shadow: inset 3px 0 0 var(--accent); }
    .card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
    .issuer { font-size: 16px; font-weight: 750; line-height: 1.35; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); font-size: 12px; background: #fff; }
    .tag.today { color: var(--accent); border-color: #99d8ce; background: var(--accent-soft); font-weight: 700; }
    .link-pill { display: inline-block; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; background: #fff; }
    .actions { white-space: nowrap; }
    .back-link { display: inline-block; margin-bottom: 12px; font-weight: 700; }
    .detail-card { margin-top: 0; }
    .detail-actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; margin: 12px 0 0; }
    .fields dt { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .fields dd { margin: 0; font-size: 14px; line-height: 1.45; }
    details.summary { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    details.summary > summary { cursor: pointer; color: var(--accent); font-weight: 700; list-style: none; }
    details.summary > summary::-webkit-details-marker { display: none; }
    details.summary > summary::before { content: "＋"; display: inline-block; width: 18px; color: var(--accent); }
    details.summary[open] > summary::before { content: "－"; }
    .summary-body { margin-top: 12px; display: grid; gap: 12px; }
    .business { padding: 10px 12px; background: var(--accent-soft); border-left: 3px solid var(--accent); }
    .finance-panel { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .finance-head { padding: 9px 12px; background: #f2f6fa; font-weight: 700; }
    .finance-note { padding: 9px 12px; border-top: 1px solid var(--line); background: #fbfcfe; color: var(--muted); font-size: 13px; }
    .table-scroll { overflow-x: auto; }
    .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .point-box, .risk-box { border-radius: 8px; padding: 11px 12px; border: 1px solid var(--line); background: var(--soft); }
    .risk-box { background: var(--warning); }
    .section-label { font-weight: 700; margin-bottom: 6px; }
    .empty { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; color: var(--muted); }
    @media (max-width: 720px) {
      .header-inner, main { padding-left: 16px; padding-right: 16px; }
      .toolbar, .card-top { display: block; }
      .actions { margin-top: 10px; white-space: normal; }
    }
  </style>
</head>
